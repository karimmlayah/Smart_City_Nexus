{% load static %}
<header class="mm-topbar fh-glass ai-dash-header" id="mmTopbar" aria-label="Top bar">
  <div class="mm-topbar__left">
    <div class="mm-topbar__brand-mini logo-mark logo-mark--xs logo-glow" aria-hidden="true">
      <img src="{% static 'images/medinamind-logo.png' %}" alt="" class="brand-logo brand-logo--xs" width="26" height="26">
    </div>
    <div class="mm-topbar__titles">
      <p class="mm-topbar__eyebrow" id="aiNavTag">Urban Intelligence · Live Monitoring</p>
      <h1 class="mm-topbar__title">AI Operations Dashboard</h1>
      <p class="mm-topbar__subtitle">Real-time AI monitoring for safer and smarter cities</p>
    </div>
  </div>
  <div class="mm-topbar__right">
    <span class="mm-topbar-badge mm-topbar-badge--live" id="aiApiStatusBadge" title="System status">
      <span class="mm-status-dot mm-status-dot--pulse" aria-hidden="true"></span>
      <span id="aiApiStatusText">System Online</span>
    </span>
    <span class="mm-topbar-badge mm-topbar-badge--clock" id="fhClock" aria-live="polite">--:--:--</span>
    <button type="button" class="mm-topbar-btn mm-theme-toggle" id="mmBtnTheme" data-theme-toggle aria-label="Switch theme" title="Switch theme">
      <svg class="mm-theme-toggle__icon mm-theme-toggle__icon--blue" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.75"/><ellipse cx="12" cy="12" rx="10" ry="3.5" stroke="currentColor" stroke-width="1.25" opacity="0.7"/><circle cx="16" cy="8" r="1.25" fill="currentColor"/></svg>
      <svg class="mm-theme-toggle__icon mm-theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="mm-theme-toggle__icon mm-theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="mm-topbar-btn mm-topbar-btn--primary" id="aiBtnRefresh" title="Refresh dashboard data">
      <span class="mm-topbar-btn__ico" id="aiRefreshIco" aria-hidden="true">↻</span>
      <span id="aiLblRefresh">Refresh</span>
    </button>
    <button type="button" class="mm-topbar-btn" id="aiBtnFullscreen" aria-pressed="false" title="Enter fullscreen">
      <span class="mm-topbar-btn__ico" aria-hidden="true">⛶</span>
      <span id="aiLblFullscreen">Fullscreen</span>
    </button>
  </div>
  <div class="mm-topbar__shimmer" aria-hidden="true"></div>
</header>
