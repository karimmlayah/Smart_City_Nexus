<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Smart City{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f6f8fa; margin: 0; }
    .site-header {
      background: #0d1117;
      color: #e6edf3;
      padding: 0 20px;
      box-shadow: 0 1px 0 rgba(255,255,255,.08);
    }
    .site-header nav {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 52px;
    }
    .site-header a {
      color: #8b949e;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 6px;
      font-size: 14px;
    }
    .site-header a:hover { color: #e6edf3; background: rgba(255,255,255,.06); }
    .site-header a.active { color: #fff; background: rgba(56, 139, 253, .2); }
    .wrap { max-width: 900px; margin: 32px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    .error { color: #b00020; margin: 12px 0; }
    .result { background: #f2f6ff; padding: 12px; border-radius: 8px; margin: 16px 0; }
    button { background: #1f6feb; color: #fff; border: 0; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #1757bb; }
    video, .out-img { width: 100%; max-height: 520px; background: #111; border-radius: 8px; margin-top: 12px; object-fit: contain; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <header class="site-header">
    <nav>
      <a href="{{ url_for('street_sign_page') }}" class="{% if active_page == 'street_sign' %}active{% endif %}">🚦 Traffic Light Violation Detection</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
